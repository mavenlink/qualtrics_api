name: CI

on: [pull_request]

jobs:
  rspec:
    runs-on: ubuntu-latest
    container:
      image: ruby:3.1.6
    env:
      BUNDLER_VERSION: "2.5.23"

    steps:
      - uses: actions/checkout@v4

      - name: Gem cache
        id: cache-bundle
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ env.BUNDLER_VERSION }}-${{ hashFiles('**/Gemfile.lock') }}

      - name: Bundle install
        env:
          RAILS_ENV: test
        run: |
          gem install bundler --version "$BUNDLER_VERSION"
          bundle _${BUNDLER_VERSION}_ install

      - name: Run tests
        env:
          RAILS_ENV: test
        run: |
          bundle _${BUNDLER_VERSION}_ exec rspec
